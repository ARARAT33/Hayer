name: Refresh public federated registry

on:
  push:
    branches: [main]
    paths:
      - 'scripts/discover-instances.mjs'
      - 'registry.schema.json'
      - 'registry.json'
      - '.github/workflows/discover-instances.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: public-registry-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Discover public instances
        run: node scripts/discover-instances.mjs
      - name: Validate registry JSON
        run: |
          node -e "const r=require('./registry.json'); if(r.version!==2||!Array.isArray(r.nodes)) process.exit(1); for(const n of r.nodes){if(!n.id||!n.url?.startsWith('https://')||!['mastodon','matrix','lemmy','peertube','pixelfed'].includes(n.type)||!Array.isArray(n.capabilities)||!n.lastCheckedAt) process.exit(1)}"
      - name: Publish updated registry
        run: |
          if git diff --quiet -- registry.json; then
            echo "Registry unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git commit -m "chore(registry): refresh public federated instances"
          # Rebase the generated snapshot on the newest main branch so a code
          # commit made while discovery was running is never overwritten.
          git fetch origin main
          git rebase --strategy-option=theirs origin/main
          git push origin HEAD:main
