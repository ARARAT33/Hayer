name: Validate Hayer
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate HTML assets and JSON
        run: python scripts/validate.py
      - name: Validate public discovery script
        run: node --check scripts/discover-instances.mjs
      - name: Validate registry schema
        run: node -e "const s=require('./registry.schema.json'); if(!s.required.includes('nodes') || !s.properties.discoveryWarnings) process.exit(1)"
      - name: Validate backend JavaScript
        run: node backend/scripts/validate.js
      - name: Test public registry backend logic
        run: node --test backend/test/*.test.js
